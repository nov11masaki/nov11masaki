name: GitHub-Profile-Summary-Cards

on:
  schedule: # 24時間ごとに自動更新
    - cron: "0 0 * * *"
  workflow_dispatch: # 手動実行用

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate

    steps:
      - uses: actions/checkout@v3
      - uses: yoshi389111/github-profile-summary-cards@gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          # テーマは他にも solarized, monokai, zenburn などがあります
          THEME: dark
